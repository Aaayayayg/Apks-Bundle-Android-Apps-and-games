name: Code detector — auto PR & issues

on:
  push:
    branches: ["AndroidAicore"]
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC; change as needed
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
    permissions:
      issues: write
      pull-requests: write
      changes: ${{ steps.check_changes.outputs.changes }}
      report-path: artifacts/report.md
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies (if any)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run code detector
        id: run_detector
        run: |
          mkdir -p artifacts
          # Exit code should be 0 even if issues found. The script should:
          # - write artifacts/report.md (report may be empty if nothing found)
          # - optionally modify files to auto-fix problems (but do NOT commit)
          python scripts/code_detector.py --report artifacts/report.md || true
          # expose report content for later steps (optional)
          echo "report_path=artifacts/report.md" >> $GITHUB_OUTPUT

      - name: Check for repo changes
        id: check_changes
        run: |
          # detect any unstaged changes made by the detector
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes and push branch
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          BRANCH=code-detector-fixes-${{ github.run_id }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore: automated fixes from code detector"
          git push --set-upstream origin "$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request for fixes
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: chore: automated fixes from code detector
          title: Automated: fix broken / missing codes
          body: |
            The code detector found issues and applied automatic fixes.
            See the detector report below:
            
            ${{ steps.run_detector.outputs.report_path || 'artifacts/report.md' }}
          base: main
          head: code-detector-fixes-${{ github.run_id }}
          delete-branch: true

      - name: Create Issue if problems found but no fixes applied
        if: steps.check_changes.outputs.changes == 'false' && ( -s artifacts/report.md )
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('artifacts/report.md', 'utf8').trim();
            if (!report) {
              console.log('No report content — nothing to do.');
              return;
            }
            const title = `Automated detector: broken/missing codes found (${new Date().toISOString().slice(0,10)})`;
            github.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The automated code detector found issues but could not apply fixes automatically.\n\nReport:\n\n${report}`
            });